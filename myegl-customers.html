<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Workspace | ERSY GLOBAL</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#102a43;background:#f4f8fa}*{box-sizing:border-box}body{margin:0}header{background:#0b2239;color:white;padding:19px max(20px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}header a{color:#c9f5f3;text-decoration:none}main{max-width:1160px;margin:28px auto;padding:0 18px}h1{margin:0 0 8px}p{line-height:1.55}.muted{color:#53687a}.layout{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:18px}.panel{background:white;border:1px solid #dbe5eb;border-radius:14px;padding:18px;box-shadow:0 8px 22px #102a4309}input,button{font:inherit;padding:10px;border:1px solid #b7cbd5;border-radius:8px}input{width:100%;margin:8px 0}button{background:#008f91;color:white;cursor:pointer;border:0}button.secondary{background:#0b2239}button:disabled{opacity:.5;cursor:default}.customer{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;background:#f7fbfc;color:#102a43;border:1px solid #dbe5eb;overflow-wrap:anywhere}.customer:hover,.customer.selected{border-color:#008f91;background:#e8f8f7}.customer strong,.customer span{display:block}.customer span{font-size:13px;color:#53687a}.pagination{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:15px;font-size:13px}.pagination button{padding:8px 12px}.record{padding:12px;border:1px solid #dbe5eb;border-radius:10px;margin:9px 0}.record strong{overflow-wrap:anywhere}.record small{display:block;color:#53687a}.record a{display:inline-block;margin-top:6px;color:#006b78;font-weight:600}details{border-top:1px solid #dbe5eb;padding:14px 0}summary{cursor:pointer;font-weight:700}.pill{display:inline-block;border-radius:20px;padding:3px 9px;background:#e5f4f4;color:#065b60;font-size:12px;font-weight:600}#status{min-height:20px}.workspace-actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #00a4a6;outline-offset:2px}@media(max-width:760px){.layout{grid-template-columns:1fr}header{padding:15px 20px;flex-wrap:wrap}}</style></head>
<body><header><strong>ERSY GLOBAL <span style="color:#8bdad7">| MyEGL Administration</span></strong><a href="/myegl-account.html">← Back to dashboard</a></header>
<main><h1>Customer Order Workspace</h1><p class="muted">Browse registered customers by customer number or email. Select an account to review its requests and orders.</p><div class="layout"><section class="panel" aria-label="Customer directory"><h2>Customer directory</h2><label for="search">Search customers</label><input id="search" type="search" placeholder="Customer number or email"><p id="directoryCount" class="muted"></p><div id="customers"></div><div class="pagination"><button id="previous" class="secondary">Previous</button><span id="pageLabel"></span><button id="next" class="secondary">Next</button></div></section><section class="panel" aria-label="Selected customer"><div id="customerDetail"><h2>Select a customer</h2><p class="muted">Choose a customer from the directory to see their order history.</p></div></section></div><p id="status" role="status"></p></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const supabase=createClient('https://mycknhzaadlaopqjpnpi.supabase.co','sb_publishable_IX3AQIFMUey57SYCI58_9w_cmSjqGCH',{auth:{persistSession:true,storage:window.sessionStorage,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id), el=(tag,value)=>{const e=document.createElement(tag);e.textContent=value??'';return e};
const number=c=>'EGL-C-'+String(c.customer_number??'—').padStart(6,'0');
let page=0,selected=null,loading=false;const size=20;
async function authCheck(){const {data:{user},error}=await supabase.auth.getUser();if(error||!user||user.app_metadata?.myegl_role!=='admin'){document.querySelector('main').replaceChildren(el('h1','Administrator access required'),el('p','Please sign in with an administrator account in MyEGL.'));const a=el('a','Go to MyEGL sign-in');a.href='/myegl-account.html';document.querySelector('main').append(a);return false}return true}
async function loadDirectory(){if(loading)return;loading=true;const search=$('search').value.trim();let query=supabase.from('portal_customers').select('id,email,customer_number,approved,review_status,created_at',{count:'exact'}).neq('email','admin@ersygloballogistics.com').order('customer_number',{ascending:true});
if(search){const numeric=search.toUpperCase().replace(/^EGL-C-/,'');if(/^\d+$/.test(numeric))query=query.eq('customer_number',Number(numeric));else query=query.ilike('email','%'+search.replace(/[%_,]/g,'')+'%')}
const {data,error,count}=await query.range(page*size,(page+1)*size-1);loading=false;const target=$('customers');target.replaceChildren();
if(error){target.append(el('p','Unable to load customers: '+error.message));return}
$('directoryCount').textContent=(count||0)+' matching customers';const pages=Math.max(1,Math.ceil((count||0)/size));$('pageLabel').textContent='Page '+(page+1)+' of '+pages;$('previous').disabled=page===0;$('next').disabled=page>=pages-1;
if(!data?.length){target.append(el('p','No matching customers.'));return}
for(const c of data){const b=el('button','');b.type='button';b.className='customer'+(selected?.id===c.id?' selected':'');b.append(el('strong',number(c)),el('span',c.email||'No email'),el('span','Account: '+(c.review_status||'pending')));b.onclick=()=>{selected=c;void loadDirectory();void loadCustomer(c)};target.append(b)}
}
async function loadCustomer(c){const target=$('customerDetail');target.replaceChildren(el('h2',number(c)),el('p',c.email||'No email'),el('p','Loading orders…'));
const [rfqs,jobs]=await Promise.all([supabase.from('myegl_rfqs').select('id,reference,service_type,status,origin,destination,archived_at,created_at',{count:'exact'}).eq('customer_id',c.id).order('created_at',{ascending:false}).limit(100),supabase.from('portal_jobs').select('id,reference,service_type,quote_status,shipment_status,archived_at,created_at',{count:'exact'}).eq('customer_id',c.id).order('created_at',{ascending:false}).limit(100)]);
target.replaceChildren(el('h2',number(c)),el('p',c.email||'No email'));target.append(el('span','Account: '+(c.review_status||'pending')));
if(rfqs.error||jobs.error){target.append(el('p','Unable to load records: '+(rfqs.error?.message||jobs.error?.message)));return}
target.append(el('p',(rfqs.count||0)+' requests · '+(jobs.count||0)+' orders'));
for(const [title,records,total,kind] of [['Customer requests',rfqs.data||[],rfqs.count||0,'rfq'],['Quotations and shipments',jobs.data||[],jobs.count||0,'job']]){const section=document.createElement('details');section.open=true;section.append(el('summary',title+' ('+total+')'));if(!records.length)section.append(el('p','No records yet.'));
for(const r of records){const row=el('div','');row.className='record';row.append(el('strong',r.reference||'Unreferenced record'),el('small',(r.service_type||'Service')+' · '+(r.status||r.quote_status||'—')+(r.shipment_status?' · Shipment: '+r.shipment_status:'')+(r.archived_at?' · Archived':'')));const a=el('a','Manage in administrator dashboard');const params=new URLSearchParams({admin_record:kind,reference:r.reference||'',archived:r.archived_at?'1':'0'});a.href='/myegl-account.html?'+params.toString();row.append(a);section.append(row)}
if(total>records.length)section.append(el('p','Showing the latest '+records.length+' of '+total+' records. Use the dashboard to search the full history.'));target.append(section)}
}
$('previous').onclick=()=>{if(page>0){page--;void loadDirectory()}};$('next').onclick=()=>{page++;void loadDirectory()};
let debounce;$('search').addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(()=>{page=0;void loadDirectory()},300)});
if(await authCheck()){await loadDirectory();const params=new URLSearchParams(location.search);const id=params.get('customer');if(id&&/^[0-9a-f-]{36}$/i.test(id)){const {data}=await supabase.from('portal_customers').select('id,email,customer_number,approved,review_status').eq('id',id).maybeSingle();if(data){selected=data;await loadCustomer(data)}}}
</script></body></html>
