<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Workspace | ERSY GLOBAL</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#102a43;background:#f4f8fa}*{box-sizing:border-box}body{margin:0}header{background:#0b2239;color:white;padding:19px max(20px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}header a{color:#c9f5f3;text-decoration:none}main{max-width:1160px;margin:28px auto;padding:0 18px}h1{margin:0 0 8px}p{line-height:1.55}.muted{color:#53687a}.layout{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:18px}.panel{background:white;border:1px solid #dbe5eb;border-radius:14px;padding:18px;box-shadow:0 8px 22px #102a4309}input,button{font:inherit;padding:10px;border:1px solid #b7cbd5;border-radius:8px}input{width:100%;margin:8px 0}button{background:#008f91;color:white;cursor:pointer;border:0}button.secondary{background:#0b2239}button:disabled{opacity:.5;cursor:default}.customer{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;background:#f7fbfc;color:#102a43;border:1px solid #dbe5eb;overflow-wrap:anywhere}.customer:hover,.customer.selected{border-color:#008f91;background:#e8f8f7}.customer strong,.customer span{display:block}.customer span{font-size:13px;color:#53687a}.pagination{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:15px;font-size:13px}.pagination button{padding:8px 12px}.record{padding:12px;border:1px solid #dbe5eb;border-radius:10px;margin:9px 0}.record strong{overflow-wrap:anywhere}.record small{display:block;color:#53687a}.record a{display:inline-block;margin-top:6px;color:#006b78;font-weight:600}details{border-top:1px solid #dbe5eb;padding:14px 0}summary{cursor:pointer;font-weight:700}.pill{display:inline-block;border-radius:20px;padding:3px 9px;background:#e5f4f4;color:#065b60;font-size:12px;font-weight:600}#status{min-height:20px}.workspace-actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #00a4a6;outline-offset:2px}@media(max-width:760px){.layout{grid-template-columns:1fr}header{padding:15px 20px;flex-wrap:wrap}}.hidden{display:none!important}.order-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.order-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}.order-field{border:1px solid #dbe5eb;border-radius:8px;padding:12px;overflow-wrap:anywhere}.order-field small{display:block;color:#53687a}.order-editor{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0}.order-editor label{display:flex;flex-direction:column;gap:6px;font-weight:600}.order-editor select,.order-editor input{width:100%;min-width:0}.order-request{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;font-size:14px}.order-editor button{align-self:end}\n.choice-group{border:1px solid #dbe5eb;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}.choice-group .choice{display:flex;align-items:center;gap:9px;font-weight:400}.choice-group .choice input{width:auto;margin:0;flex:none}.choice-group textarea,.choice-group>input{width:100%;box-sizing:border-box}.order-request{white-space:pre-wrap}\n</style></head>
<body><header><strong>ERSY GLOBAL <span style="color:#8bdad7">| MyEGL Administration</span></strong><a href="/myegl-account.html">← Back to dashboard</a></header>
<main><h1>Customer Order Workspace</h1><p class="muted">Browse registered customers by customer number or email. Select an account to review its requests and orders.</p><div class="layout"><section class="panel" aria-label="Customer directory"><h2>Customer directory</h2><label for="search">Search customers</label><input id="search" type="search" placeholder="Customer number or email"><p id="directoryCount" class="muted"></p><div id="customers"></div><div class="pagination"><button id="previous" class="secondary">Previous</button><span id="pageLabel"></span><button id="next" class="secondary">Next</button></div></section><section class="panel" aria-label="Selected customer"><div id="orderDetail" class="hidden"></div><div id="customerDetail"><h2>Select a customer</h2><p class="muted">Choose a customer from the directory to see their order history.</p></div></section></div><p id="status" role="status"></p></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const supabase=createClient('https://mycknhzaadlaopqjpnpi.supabase.co','sb_publishable_IX3AQIFMUey57SYCI58_9w_cmSjqGCH',{auth:{persistSession:true,storage:window.sessionStorage,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id), el=(tag,value)=>{const e=document.createElement(tag);e.textContent=value??'';return e};
const number=c=>'EGL-C-'+String(c.customer_number??'—').padStart(6,'0');
let page=0,selected=null,loading=false;const size=20;
async function authCheck(){const {data:{user},error}=await supabase.auth.getUser();if(error||!user||user.app_metadata?.myegl_role!=='admin'){document.querySelector('main').replaceChildren(el('h1','Administrator access required'),el('p','Please sign in with an administrator account in MyEGL.'));const a=el('a','Go to MyEGL sign-in');a.href='/myegl-account.html';document.querySelector('main').append(a);return false}return true}
async function loadDirectory(){if(loading)return;loading=true;const search=$('search').value.trim();let query=supabase.from('portal_customers').select('id,email,customer_number,approved,review_status,created_at',{count:'exact'}).neq('email','admin@ersygloballogistics.com').order('customer_number',{ascending:true});
if(search){const numeric=search.toUpperCase().replace(/^EGL-C-/,'');if(/^\d+$/.test(numeric))query=query.eq('customer_number',Number(numeric));else query=query.ilike('email','%'+search.replace(/[%_,]/g,'')+'%')}
const {data,error,count}=await query.range(page*size,(page+1)*size-1);loading=false;const target=$('customers');target.replaceChildren();
if(error){target.append(el('p','Unable to load customers: '+error.message));return}
$('directoryCount').textContent=(count||0)+' matching customers';const pages=Math.max(1,Math.ceil((count||0)/size));$('pageLabel').textContent='Page '+(page+1)+' of '+pages;$('previous').disabled=page===0;$('next').disabled=page>=pages-1;
if(!data?.length){target.append(el('p','No matching customers.'));return}
for(const c of data){const b=el('button','');b.type='button';b.className='customer'+(selected?.id===c.id?' selected':'');b.append(el('strong',number(c)),el('span',c.email||'No email'),el('span','Account: '+(c.review_status||'pending')));b.onclick=()=>{selected=c;void loadDirectory();void loadCustomer(c)};target.append(b)}
}
async function loadCustomer(c){const target=$('customerDetail');target.replaceChildren(el('h2',number(c)),el('p',c.email||'No email'),el('p','Loading orders…'));
const [rfqs,jobs]=await Promise.all([supabase.from('myegl_rfqs').select('id,reference,service_type,status,origin,destination,archived_at,created_at',{count:'exact'}).eq('customer_id',c.id).order('created_at',{ascending:false}).limit(100),supabase.from('portal_jobs').select('id,reference,service_type,quote_status,shipment_status,archived_at,created_at',{count:'exact'}).eq('customer_id',c.id).order('created_at',{ascending:false}).limit(100)]);
target.replaceChildren(el('h2',number(c)),el('p',c.email||'No email'));target.append(el('span','Account: '+(c.review_status||'pending')));
if(rfqs.error||jobs.error){target.append(el('p','Unable to load records: '+(rfqs.error?.message||jobs.error?.message)));return}
target.append(el('p',(rfqs.count||0)+' requests · '+(jobs.count||0)+' orders'));
for(const [title,records,total,kind] of [['Customer requests',rfqs.data||[],rfqs.count||0,'rfq'],['Quotations and shipments',jobs.data||[],jobs.count||0,'job']]){const section=document.createElement('details');section.open=true;section.append(el('summary',title+' ('+total+')'));if(!records.length)section.append(el('p','No records yet.'));
for(const r of records){const row=el('div','');row.className='record';row.append(el('strong',r.reference||'Unreferenced record'),el('small',(r.service_type||'Service')+' · '+(r.status||r.quote_status||'—')+(r.shipment_status?' · Shipment: '+r.shipment_status:'')+(r.archived_at?' · Archived':'')));const a=el('button','Open order details');a.type='button';a.onclick=()=>void openOrder(kind,r.id);row.append(a);section.append(row)}
if(total>records.length)section.append(el('p','Showing the latest '+records.length+' of '+total+' records. Use the dashboard to search the full history.'));target.append(section)}
}

async function openOrder(kind,id){
const target=$('orderDetail');$('customerDetail').classList.add('hidden');target.classList.remove('hidden');target.replaceChildren(el('p','Loading order details…'));
const table=kind==='rfq'?'myegl_rfqs':'portal_jobs';const {data:r,error}=await supabase.from(table).select('*').eq('id',id).single();
target.replaceChildren();const back=el('button','← Back to customer orders');back.className='secondary';back.onclick=()=>{target.classList.add('hidden');$('customerDetail').classList.remove('hidden')};target.append(back);
if(error||!r){target.append(el('p','Unable to load record: '+(error?.message||'Not found')));return}
target.append(el('h2',(kind==='rfq'?'Request for Quote':'Order')+' · '+(r.reference||'No reference')));
const grid=el('div','');grid.className='order-fields';target.append(grid);
const field=(label,value)=>{const d=el('div','');d.className='order-field';d.append(el('small',label),el('strong',value===undefined||value===null||value===''?'Not provided':String(value)));grid.append(d)};
field('Service',r.service_type);field('Origin',r.origin);field('Destination',r.destination);field('Submitted',r.created_at?new Date(r.created_at).toLocaleString():'—');field('Customer',selected?.email||r.customer_email||r.customer_id);field('Reference',r.reference);
const req=el('details','');req.open=true;req.append(el('summary','Customer request and requirements'));const raw=r.request_details||r.details;const displayReq=(container,value)=>{if(value&&typeof value==='object'&&!Array.isArray(value)){const g=el('div','');g.className='order-fields';for(const [key,v] of Object.entries(value)){if(v==null||v==='')continue;const d=el('div','');d.className='order-field';const label=key.replace(/([a-z])([A-Z])/g,'$1 $2').replaceAll('_',' ');d.append(el('small',label.charAt(0).toUpperCase()+label.slice(1)),el('strong',typeof v==='object'?Array.isArray(v)?v.join(', '):Object.entries(v).map(([k,x])=>k+': '+x).join(', '):String(v)));g.append(d)}container.append(g)}else container.append(el('p',value||'No additional requirements recorded'))};displayReq(req,raw);target.append(req);
const editor=el('div','');editor.className='order-editor';target.append(editor);
const select=(label,value,options)=>{const wrap=el('label','');wrap.append(el('span',label));const input=el('select','');for(const v of [...new Set([...options,...(value?[value]:[])])]){const o=el('option',v.replaceAll('_',' '));o.value=v;input.append(o)}input.value=value||options[0];wrap.append(input);editor.append(wrap);return input};
const status=el('p','');status.setAttribute('role','status');
if(kind==='rfq'){
field('Current request stage',r.status);
const stage=select('Request stage',r.status,['submitted','under_review','quoted','closed']);
const save=el('button','Save request stage');save.onclick=async()=>{save.disabled=true;const {error}=await supabase.from('myegl_rfqs').update({status:stage.value}).eq('id',id);save.disabled=false;status.textContent=error?'Save failed: '+error.message:'Request stage saved. Customer portal will show the updated stage.';if(!error&&selected)void loadCustomer(selected)};editor.append(save);
const {data:linked}=await supabase.from('portal_jobs').select('id,reference').eq('customer_id',r.customer_id).eq('reference',r.reference).limit(1);
if(linked?.length){const open=el('button','Open linked order / shipment');open.className='secondary';open.onclick=()=>void openOrder('job',linked[0].id);editor.append(open)}else target.append(el('p','No linked order exists for this RFQ yet. Payment and tracking can be updated once a shipment/order record is created.'));
}else{
field('Quotation stage',r.quote_status);field('Quoted amount',r.quoted_total==null?'Not quoted':(r.currency||'AED')+' '+r.quoted_total);field('Payment stage',r.payment_status);field('Shipment stage',r.shipment_status);field('Tracking number',r.tracking_number);field('Carrier',r.tracking_carrier);field('Estimated transit / delivery date',r.estimated_transit_date);
const canPrepare=['not_quoted','draft','declined','revision_requested','expired','pending'].includes(r.quote_status);if(!canPrepare)target.append(el('p','This quotation is '+(r.quote_status||'finalized')+'. To protect the customer-approved amount, draft editing is disabled. Create a new quotation revision through a separate approval workflow.'));const quotePanel=el('details','');quotePanel.open=canPrepare;quotePanel.append(el('summary','Prepare and send customer quotation'));const quoteForm=el('form','');quoteForm.className='order-editor';
const addInput=(label,type,value)=>{const l=el('label','');l.append(el('span',label));const i=el('input','');i.type=type;i.value=value??'';l.append(i);quoteForm.append(l);return i};
const amount=addInput('Quoted amount','number',r.quoted_total);amount.min='0.01';amount.step='0.01';amount.required=true;
const currencyLabel=el('label','');currencyLabel.append(el('span','Currency'));const currency=el('select','');for(const code of ['AED','USD','EUR','GBP','GHS']){const o=el('option',code);o.value=code;currency.append(o)}currency.value=r.currency||'AED';currencyLabel.append(currency);quoteForm.append(currencyLabel);
const valid=addInput('Quotation valid until','date',r.quotation_valid_until);valid.required=true;
const transit=addInput('Estimated transit / delivery date','date',r.estimated_transit_date);
const serviceOptions=['Supplier sourcing','Purchasing and order management','Supplier coordination','Cargo pickup','Export documentation','Freight booking','Air freight','Ocean freight','Road freight','Customs clearance coordination','Cargo insurance','Warehousing and storage','Packing and consolidation','Last-mile delivery','Shipment tracking and updates'];
const existingServices=Array.isArray(r.included_services)?r.included_services:[];const serviceWrap=el('details','');serviceWrap.className='choice-group';serviceWrap.append(el('summary','Included services — choose options'));serviceWrap.open=false;const serviceChoices=new Map();
for(const name of [...new Set([...serviceOptions,...existingServices])]){const l=el('label','');l.className='choice';const cb=el('input','');cb.type='checkbox';cb.checked=existingServices.includes(name);serviceChoices.set(name,cb);l.append(cb,el('span',name));serviceWrap.append(l)}const otherServices=el('input','');otherServices.placeholder='Additional service (optional)';otherServices.setAttribute('aria-label','Additional service');serviceWrap.append(otherServices);quoteForm.append(serviceWrap);
const termOptions=['Quotation subject to acceptance of scope and terms','Rates subject to carrier availability and final booking confirmation','Transit dates are estimates and may change','Customs duties, taxes and inspections excluded unless specified','Cargo insurance excluded unless explicitly included','Additional storage, demurrage and detention charged separately','Payment terms as stated on the issued invoice','Quotation valid until the stated expiry date'];
const termWrap=el('details','');termWrap.className='choice-group';termWrap.append(el('summary','Quotation terms — choose options'));termWrap.open=false;const termChoices=new Map();
for(const name of termOptions){const l=el('label','');l.className='choice';const cb=el('input','');cb.type='checkbox';cb.checked=(r.quotation_terms||'').includes(name);termChoices.set(name,cb);l.append(cb,el('span',name));termWrap.append(l)}const otherTerms=el('textarea','');otherTerms.rows=3;otherTerms.placeholder='Additional or custom quotation terms (optional)';otherTerms.value=(r.quotation_terms||'').split('\\n').filter(x=>x&&!termOptions.includes(x.trim())).join('\\n');termWrap.append(otherTerms);quoteForm.append(termWrap);
const quoteNote=el('p','');quoteNote.setAttribute('role','status');
const draft=el('button','Save draft quotation');draft.type='submit';quoteForm.append(draft,quoteNote);
quoteForm.onsubmit=async e=>{e.preventDefault();draft.disabled=true;quoteNote.textContent='Saving quotation…';const {error}=await supabase.rpc('myegl_admin_prepare_quote',{p_job_id:id,p_currency:currency.value,p_total:Number(amount.value),p_services:[...[...serviceChoices].filter(([name,cb])=>cb.checked).map(([name])=>name),...(otherServices.value.trim()?[otherServices.value.trim()]:[])].join('\n'),p_terms:[...[...termChoices].filter(([name,cb])=>cb.checked).map(([name])=>name),otherTerms.value.trim()].filter(Boolean).join('\n'),p_valid_until:valid.value});if(error){quoteNote.textContent='Unable to save quotation: '+error.message;draft.disabled=false;return}if(transit.value){const update=await supabase.from('portal_jobs').update({estimated_transit_date:transit.value}).eq('id',id);if(update.error){quoteNote.textContent='Quote saved, but estimated transit date could not be saved: '+update.error.message;draft.disabled=false;return}}quoteNote.textContent='Draft saved. Open the order again to send it.';draft.disabled=false;void openOrder('job',id)};
quotePanel.append(quoteForm);
if(r.quote_status==='draft'){const send=el('button','Send quotation to customer');send.type='button';send.onclick=async()=>{if(!confirm('Publish this quotation to the customer portal and send an email notification?'))return;send.disabled=true;quoteNote.textContent='Sending quotation…';const {data,error}=await supabase.functions.invoke('myegl-send-quotation',{body:{job_id:id}});if(error||!data?.published){quoteNote.textContent='Unable to publish: '+(data?.message||error?.message||'Unknown error');send.disabled=false;return}quoteNote.textContent=data.message||'Quotation published.';void openOrder('job',id)};quotePanel.append(send)}
if(canPrepare)target.append(quotePanel);
const payment=select('Payment status',r.payment_status,['not_requested','pending','unpaid','partially_paid','paid']);
const shipment=select('Shipment stage',r.shipment_status,['not_started','preparing','booked','in_transit','customs_clearance','out_for_delivery','delivered']);
const label=el('label','');label.append(el('span','Tracking number'));const tracking=el('input','');tracking.type='text';tracking.maxLength=150;tracking.placeholder='Carrier tracking number';tracking.value=r.tracking_number||'';label.append(tracking);editor.append(label);const carrier=select('Shipping carrier',r.tracking_carrier||'Other',['DHL','FedEx','Aramex','UPS','Other']);const etaLabel=el('label','');etaLabel.append(el('span','Estimated transit / delivery date'));const eta=el('input','');eta.type='date';eta.value=r.estimated_transit_date||'';etaLabel.append(eta);editor.append(etaLabel);
const save=el('button','Save shipment and payment');save.onclick=async()=>{save.disabled=true;const {error}=await supabase.from('portal_jobs').update({payment_status:payment.value,shipment_status:shipment.value,tracking_number:tracking.value.trim()||null,tracking_carrier:carrier.value,estimated_transit_date:eta.value||null,updated_at:new Date().toISOString()}).eq('id',id);save.disabled=false;status.textContent=error?'Save failed: '+error.message:'Saved. The customer can view the shipment status and tracking number after refreshing their portal.';if(!error){if(selected)void loadCustomer(selected);void openOrder('job',id)}};editor.append(save);
if(r.quote_status==='approved'){const create=el('button','Create invoice draft from approved quote');create.type='button';create.className='secondary';create.onclick=async()=>{if(!confirm('Create an internal invoice draft? It will not be visible to customers until issued.'))return;create.disabled=true;const {data,error}=await supabase.rpc('myegl_admin_create_invoice_draft',{p_job_id:id});if(error){status.textContent='Unable to create invoice: '+error.message;create.disabled=false}else{status.textContent='Invoice draft created: '+(data?.number||'Draft');void openOrder('job',id)}};target.append(create)}
const {data:invoices,error:invoiceError}=await supabase.from('myegl_invoices').select('invoice_number,status,total,currency,amount_paid,due_date').eq('job_id',id).order('created_at',{ascending:false}).limit(20);const section=el('details','');section.open=true;section.append(el('summary','Invoices and payments'));if(invoiceError)section.append(el('p','Unable to load invoices: '+invoiceError.message));else if(!invoices?.length)section.append(el('p','No invoice recorded for this order.'));else for(const inv of invoices)section.append(el('p',(inv.invoice_number||'Invoice')+' · '+(inv.status||'—')+' · '+(inv.currency||'AED')+' '+(inv.total??'—')+' · Paid '+(inv.amount_paid??0)));target.append(section);
}
target.append(status);
}

$('previous').onclick=()=>{if(page>0){page--;void loadDirectory()}};$('next').onclick=()=>{page++;void loadDirectory()};
let debounce;$('search').addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(()=>{page=0;void loadDirectory()},300)});
if(await authCheck()){await loadDirectory();const params=new URLSearchParams(location.search);const id=params.get('customer');if(id&&/^[0-9a-f-]{36}$/i.test(id)){const {data}=await supabase.from('portal_customers').select('id,email,customer_number,approved,review_status').eq('id',id).maybeSingle();if(data){selected=data;await loadCustomer(data)}}}
</script></body></html>
