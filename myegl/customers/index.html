async function loadDirectory(){if(loading)return;loading=true;const search=$('search').value.trim();let query=supabase.from('portal_customers').select('id,email,customer_number,approved,review_status,created_at',{count:'exact'}).neq('email','admin@ersygloballogistics.com').order('customer_number',{ascending:true});

for(const r of records){const row=el('div','');row.className='record';row.append(el('strong',r.reference||'Unreferenced record'),el('small',(r.service_type||'Service')+' · '+(r.status||r.quote_status||'—')+(r.shipment_status?' · Shipment: '+r.shipment_status:'')+(r.archived_at?' · Archived':'')));const a=el('button','Open order details');a.type='button';a.onclick=()=>void openOrder(kind,r.id);row.append(a);section.append(row)}
if(total>records.length)section.append(el('p','Showing the latest '+records.length+' of '+total+' records. Use the dashboard to search the full history.'));target.append(section)}
}

const shipment=select('Shipment stage',r.shipment_status,['not_started','preparing','booked','in_transit','customs_clearance','out_for_delivery','delivered']);
const label=el('label','');label.append(el('span','Tracking number'));const tracking=el('input','');tracking.type='text';tracking.maxLength=150;tracking.placeholder='Carrier tracking number';tracking.value=r.tracking_number||'';label.append(tracking);editor.append(label);const carrier=select('Shipping carrier',r.tracking_carrier||'Other',['DHL','FedEx','Aramex','UPS','Other']);const etaLabel=el('label','');etaLabel.append(el('span','Estimated transit / delivery date'));const eta=el('input','');eta.type='date';eta.value=r.estimated_transit_date||'';etaLabel.append(eta);editor.append(etaLabel);
const save=el('button','Save shipment and payment');save.onclick=async()=>{save.disabled=true;const {error}=await supabase.rpc('myegl_admin_update_shipment',{p_job_id:id,p_payment:payment.value,p_shipment:shipment.value,p_tracking:tracking.value.trim(),p_carrier:carrier.value,p_eta:eta.value||null,p_pickup:pickupInput.value||null});save.disabled=false;status.textContent=error?'Save failed: '+error.message:'Saved. The customer can view the shipment status and tracking number after refreshing their portal.';if(!error){if(selected)void loadCustomer(selected);void openOrder('job',id)}};editor.append(save);
if(r.quote_status==='approved'){const create=el('button','Create invoice draft from approved quote');create.type='button';create.className='secondary';create.onclick=async()=>{if(!confirm('Create an internal invoice draft? It will not be visible to customers until issued.'))return;create.disabled=true;const {data,error}=await supabase.rpc('myegl_admin_create_invoice_draft',{p_job_id:id});if(error){status.textContent='Unable to create invoice: '+error.message;create.disabled=false}else{status.textContent='Invoice draft created: '+(data?.number||'Draft');void openOrder('job',id)}};target.append(create)}
const {data:invoices,error:invoiceError}=await supabase.from('myegl_invoices').select('id,invoice_number,status,total,subtotal,currency,amount_paid,due_date,issued_at,notes,customer_email').eq('job_id',id).order('created_at',{ascending:false}).limit(20);const section=el('details','');section.open=true;section.append(el('summary','Invoices and payments'));if(invoiceError)section.append(el('p','Unable to load invoices: '+invoiceError.message));else if(!invoices?.length)section.append(el('p','No invoice recorded for this order.'));else for(const inv of invoices){const card=el('div','');card.className='order-field';card.append(el('strong',(inv.invoice_number||'Invoice')+' · '+inv.status));card.append(el('p',(inv.currency||'AED')+' '+(inv.total??'—')+' · Paid '+(inv.amount_paid??0)));const dueLabel=el('label','');dueLabel.append(el('span','Invoice due date'));const dueInput=el('input','');dueInput.type='date';dueInput.value=inv.due_date?String(inv.due_date).slice(0,10):'';dueInput.disabled=!['draft','issued'].includes(inv.status)||Number(inv.amount_paid||0)>0;dueInput.style.cssText='display:block;max-width:240px;margin:6px 0 10px';dueLabel.append(dueInput);card.append(dueLabel);if(!dueInput.disabled){const saveDue=el('button','Save due date');saveDue.type='button';saveDue.className='secondary';saveDue.onclick=async()=>{if(!dueInput.value){status.textContent='Please select a due date.';return}saveDue.disabled=true;const {error}=await supabase.rpc('myegl_admin_set_invoice_due_date',{p_invoice_id:inv.id,p_due_date:dueInput.value});if(error){status.textContent='Unable to save due date: '+error.message;saveDue.disabled=false}else{status.textContent='Invoice due date saved.';void openOrder('job',id)}};card.append(saveDue)}const view=el('button','View invoice');view.type='button';view.onclick=async()=>{view.disabled=true;try{const existing=card.querySelector('.invoice-preview');if(existing){existing.remove();view.textContent='View invoice';return}const url=await adminInvoicePDF({...inv,customer_email:inv.customer_email||selected?.email||r.customer_email},r,'preview');const wrapper=el('div','');wrapper.className='invoice-preview';const frame=document.createElement('iframe');frame.title='Invoice '+inv.invoice_number;frame.src=url;frame.style.cssText='width:100%;height:680px;border:1px solid #d9e1e8;border-radius:8px;background:white';wrapper.append(frame);card.append(wrapper);view.textContent='Hide invoice';wrapper.scrollIntoView({block:'nearest'});setTimeout(()=>URL.revokeObjectURL(url),120000)}catch(e){status.textContent='Unable to preview invoice: '+e.message}finally{view.disabled=false}};card.append(view);const download=el('button','Download invoice PDF');download.type='button';download.className='secondary';download.onclick=async()=>{download.disabled=true;try{await adminInvoicePDF({...inv,customer_email:inv.customer_email||selected?.email||r.customer_email},r)}catch(e){status.textContent='Unable to download invoice: '+e.message}finally{download.disabled=false}};card.append(download);if(inv.status==='draft'){const issue=el('button','Issue invoice to customer');issue.type='button';issue.onclick=async()=>{if(!dueInput.value){status.textContent='Please choose and save the invoice due date before issuing.';return}if(!confirm('Issue invoice '+inv.invoice_number+' to this customer? It will become available in their portal for viewing and PDF download.'))return;issue.disabled=true;const {error}=await supabase.rpc('myegl_admin_issue_invoice',{p_invoice_id:inv.id});if(error){status.textContent='Unable to issue invoice: '+error.message;issue.disabled=false}else void openOrder('job',id)};card.append(issue)}section.append(card)}target.append(section);
}
target.append(status);
}

$('previous').onclick=()=>{if(page>0){page--;void loadDirectory()}};$('next').onclick=()=>{page++;void loadDirectory()};
let debounce;$('search').addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(()=>{page=0;void loadDirectory()},300)});
if(await authCheck()){await loadDirectory();const params=new URLSearchParams(location.search);const order=params.get('order'),kind=params.get('type');if(order&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(order)&&['job','rfq'].includes(kind)){await openOrder(kind,order)}else{const id=params.get('customer');if(id&&/^[0-9a-f-]{36}$/i.test(id)){const {data}=await supabase.from('portal_customers').select('id,email,customer_number,approved,review_status').eq('id',id).maybeSingle();if(data){selected=data;await loadCustomer(data)}}}}
async function adminInvoicePDF(inv,job,mode='download'){const {renderCommercialPDF}=await import('/myegl-commercial-pdf.js?v=20261115c');return renderCommercialPDF('invoice',inv,job,mode)}
