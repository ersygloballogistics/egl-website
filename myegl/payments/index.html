<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PayPal connection | MyEGL</title><link rel="icon" href="/favicon.svg"><style>:root{font-family:system-ui,sans-serif;color:#102a43;background:#f4f8fa}*{box-sizing:border-box}body{margin:0}header{background:#0b2239;color:white;padding:22px}header a{color:white}main{max-width:900px;margin:28px auto;padding:0 16px}.panel{background:white;border:1px solid #dbe5eb;border-radius:14px;padding:22px;margin:16px 0}button{font:inherit;background:#008f91;color:white;border:0;border-radius:8px;padding:12px 16px;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}.receipt{overflow-wrap:anywhere;border-top:1px solid #dbe5eb;padding:12px 0}.muted{color:#53687a}</style></head><body><header><strong>ERSY GLOBAL · MyEGL</strong> · <a href="/myegl/customers/">Customer workspace</a></header><main><h1>PayPal connection</h1><p id="status" role="status">Checking administrator access…</p><section id="tools" class="panel" hidden><h2>Connection status</h2><button id="check" type="button">Check PayPal connection</button><p id="health" role="status"></p><p class="muted">This check does not create an order or charge a payment.</p><h2>Recent PayPal payments</h2><div id="receipts"></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
import {paypalCall} from '/myegl-paypal.js?v=20261116a';
const db=createClient('https://mycknhzaadlaopqjpnpi.supabase.co','sb_publishable_IX3AQIFMUey57SYCI58_9w_cmSjqGCH',{auth:{persistSession:true,storage:window.sessionStorage,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
async function start(){const {data:{user},error}=await db.auth.getUser();if(error||user?.app_metadata?.myegl_role!=='admin'){$('status').textContent='Please sign in to MyEGL with an administrator account.';return}
$('status').textContent='Administrator access confirmed.';$('tools').hidden=false;
$('check').onclick=async()=>{$('check').disabled=true;$('health').textContent='Checking…';try{const h=await paypalCall(db,{action:'health'});$('health').textContent=h.ready&&h.credentials_verified?'PayPal is connected and enabled for issued invoices.':'PayPal is not enabled yet. Credentials: '+(h.credentials_verified?'verified':'pending')+' · Webhook: '+(h.webhook_configured?'configured':'pending')+' · Checkout: '+(h.enabled?'enabled':'disabled')}catch(e){$('health').textContent=e.message}finally{$('check').disabled=false}};
const {data:rows,error:loadError}=await db.from('myegl_paypal_orders').select('invoice_id,status,capture_id,paypal_order_id,paypal_amount,paypal_currency,invoice_amount,invoice_currency,failure_code,created_at').eq('mode','live').order('created_at',{ascending:false}).limit(30);
if(loadError){$('receipts').textContent='Unable to load PayPal payments.';return}if(!rows?.length){$('receipts').textContent='No PayPal payments recorded.';return}
for(const r of rows){const d=document.createElement('div');d.className='receipt';const p=document.createElement('p');p.textContent=r.status.replaceAll('_',' ')+' · '+r.paypal_currency+' '+r.paypal_amount+' · Invoice balance '+r.invoice_currency+' '+r.invoice_amount;const ref=document.createElement('p');ref.textContent='Order '+(r.paypal_order_id||'not created')+' · Capture '+(r.capture_id||'not captured')+(r.failure_code?' · Review: '+r.failure_code:'');d.append(p,ref);$('receipts').append(d)}
}start().catch(()=>{$('status').textContent='Unable to load connection status.'});
</script></body></html>
